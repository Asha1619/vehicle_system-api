{% extends 'base.html' %}

{% block title %}
Vehicle Form
{% endblock %}


{% block content %}

<div class="card">

    <div class="card-body">

        {% if vehicle %}

            <h2>Edit Vehicle</h2>

        {% else %}

            <h2>Add Vehicle</h2>

        {% endif %}


        <form method="POST">

            {% csrf_token %}


            <div class="mb-3">

                <label class="form-label">
                    Vehicle Name
                </label>

                <input
                    type="text"
                    name="name"
                    class="form-control"
                    value="{{ vehicle.name|default:'' }}"
                    required>

            </div>


            <div class="mb-3">

                <label class="form-label">
                    Brand
                </label>

                <input
                    type="text"
                    name="brand"
                    class="form-control"
                    value="{{ vehicle.brand|default:'' }}"
                    required>

            </div>


            <div class="mb-3">

                <label class="form-label">
                    Year
                </label>

                <input
                    type="number"
                    name="year"
                    class="form-control"
                    value="{{ vehicle.year|default:'' }}"
                    required>

            </div>


            <div class="mb-3">

                <label class="form-label">
                    Price Per Day
                </label>

                <input
                    type="number"
                    step="0.01"
                    name="price_per_day"
                    class="form-control"
                    value="{{ vehicle.price_per_day|default:'' }}"
                    required>

            </div>


            <div class="mb-3">

                <label class="form-label">
                    Fuel Type
                </label>

                <select
                    name="fuel_type"
                    class="form-select"
                    required>

                    <option value="">
                        Select Fuel Type
                    </option>

                    <option value="Petrol"
                        {% if vehicle.fuel_type == 'Petrol' %}selected{% endif %}>
                        Petrol
                    </option>

                    <option value="Diesel"
                        {% if vehicle.fuel_type == 'Diesel' %}selected{% endif %}>
                        Diesel
                    </option>

                    <option value="Electric"
                        {% if vehicle.fuel_type == 'Electric' %}selected{% endif %}>
                        Electric
                    </option>

                    <option value="Hybrid"
                        {% if vehicle.fuel_type == 'Hybrid' %}selected{% endif %}>
                        Hybrid
                    </option>

                </select>

            </div>


            <button
                type="submit"
                class="btn btn-primary">

                Save Vehicle

            </button>


            <a
                href="{% url 'vehicle_list' %}"
                class="btn btn-secondary">

                Cancel

            </a>

        </form>

    </div>

</div>

{% endblock %}
